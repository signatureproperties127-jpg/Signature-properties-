services:
  - type: web
    name: signature-properties
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://signature-properties.onrender.com
      - key: PORT
        value: 10000
