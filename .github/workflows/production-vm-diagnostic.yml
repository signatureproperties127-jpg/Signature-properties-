name: Production VM Diagnostic

on:
  push:
    branches:
      - copilot/discover-production-access
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm-health:
    # Read-only diagnostics only; no production mutations.
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VM_SSH_PORT }}" -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Run read-only VM diagnostics
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VM_SSH_PORT }}" \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" bash -s <<'ENDSSH'
          set -euo pipefail

          APP_HOME="${APP_HOME:-$HOME/signature-properties}"

          echo "=== VM HEALTH ==="
          hostname -f
          hostname
          date --iso-8601=seconds
          pwd

          echo "=== SERVICE STATUS ==="
          systemctl is-active signature-realty
          sudo ss -ltnp | grep -F ':4173'
          sudo systemctl status signature-realty --no-pager

          echo "=== APP CHECKOUT ==="
          if [ -d "$APP_HOME/.git" ]; then
            git -C "$APP_HOME" rev-parse --show-toplevel
            git -C "$APP_HOME" rev-parse --abbrev-ref HEAD
            git -C "$APP_HOME" rev-parse HEAD
            git -C "$APP_HOME" status --short --branch
          else
            echo "App checkout not found at $APP_HOME" >&2
            exit 1
          fi
          ENDSSH

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
