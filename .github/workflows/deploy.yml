name: Deploy to VM

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VM_SSH_PORT }}" -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VM_SSH_PORT }}" \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" bash -s <<'EOF'
          set -euo pipefail

          cd ~/signature-properties

          BEFORE_SHA=$(git rev-parse HEAD)

          git fetch origin
          git pull --ff-only origin main

          AFTER_SHA=$(git rev-parse HEAD)

          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -qx 'package.json'; then
            npm install --omit=dev
          fi

          sudo systemctl restart signature-realty

          for i in $(seq 1 10); do
            systemctl is-active --quiet signature-realty && break
            sleep 1
          done
          systemctl is-active signature-realty

          for i in $(seq 1 10); do
            curl -fsS http://127.0.0.1:4173/api/dashboard && exit 0
            sleep 1
          done
          curl -f http://127.0.0.1:4173/api/dashboard
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
